[project]
name = "claude-provider-support"
version = "2.0.0"
description = "Claude Provider Support: MaiBot LLM Provider plugin for the Claude Messages API and compatible endpoints"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# 与 manifest 的 dependencies 一一对应；maibot-plugin-sdk 由宿主提供，版本范围写在 manifest 的 sdk 字段
dependencies = [
    "anthropic>=2.1.0,<3.0.0",
]

[dependency-groups]
dev = [
    "maibot-plugin-sdk>=2.12.0,<3.0.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
